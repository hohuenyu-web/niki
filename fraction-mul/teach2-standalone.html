<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>分數乘法二教學｜順德聯誼總會何日東小學</title>
<style>
  :root {
    --bg: #fff8f0; --text: #2c3e50; --muted: #7f8c8d;
    --success: #27ae60; --danger: #e74c3c;
    --shadow: 0 4px 16px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; max-width: 100%; min-height: 100%;
    font-family: "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-tap-highlight-color: transparent; overflow-x: hidden;
  }
  body { min-height: 100vh; }
  .page {
    min-height: 100vh; padding: 12px; width: 100%;
    display: flex; flex-direction: column; align-items: center;
  }
  .header { text-align: center; margin-bottom: 14px; width: 100%; }
  .header h1 { font-size: clamp(1.35rem, 4vw, 1.85rem); color: #d35400; margin-bottom: 4px; }
  .header .school { font-size: 0.85rem; color: var(--muted); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: none; border-radius: 12px; padding: 12px 18px;
    font-size: 1rem; font-weight: 600; cursor: pointer; font-family: inherit;
    transition: transform 0.1s, background 0.15s; min-height: 48px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-ghost { background: #f5f0ea; color: var(--text); }
  .btn-ghost:hover { background: #ebe3d8; }

  .exp-card {
    width: 100%; max-width: min(960px, 100%);
    background: #fff; border-radius: 18px; box-shadow: var(--shadow);
    border: 2px solid #e8eef5; padding: 14px 14px 18px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .exp-title {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: clamp(1.15rem, 3.5vw, 1.45rem); font-weight: 800; color: #2c5aa0;
  }
  .exp-title .exp-ico {
    width: 28px; height: 28px; border-radius: 6px;
    background: linear-gradient(135deg, #5dade2, #e74c3c 40%, #f1c40f 70%, #27ae60);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.5);
    flex-shrink: 0;
  }
  .exp-modes {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  }
  .exp-mode-btn {
    border: 2px solid #d5dde8; background: #f7f9fc; border-radius: 999px;
    padding: 8px 14px; font-weight: 800; font-family: inherit; cursor: pointer;
    color: #5d6d7e; font-size: 0.95rem; min-height: 44px;
  }
  .exp-mode-btn:hover { background: #eef3f8; }
  .exp-mode-btn.active {
    border-color: #2c5aa0; background: #eaf2fb; color: #2c5aa0;
  }
  .exp-eq.mixed { font-size: clamp(1.15rem, 3.2vw, 1.65rem); }
  .exp-whole[hidden] { display: none !important; }
  .exp-whole { line-height: 1; }
  .exp-chip.as-mixed {
    display: inline-grid;
    grid-template-columns: auto auto;
    grid-template-rows: auto auto;
    align-items: center;
    justify-items: center;
    column-gap: 4px;
  }
  .exp-chip.as-mixed .exp-whole { grid-column: 1; grid-row: 1 / span 2; align-self: center; }
  .exp-chip.as-mixed .exp-num { grid-column: 2; grid-row: 1; }
  .exp-chip.as-mixed .exp-den { grid-column: 2; grid-row: 2; }
  .exp-chip.as-int .exp-num,
  .exp-chip.as-int .exp-den { display: none !important; }
  .exp-body {
    display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; justify-content: center;
  }
  .exp-canvas-wrap {
    flex: 1 1 280px; max-width: 480px; min-width: 240px;
    aspect-ratio: 1 / 1; width: 100%;
    position: relative;
  }
  .exp-canvas-wrap.compact { aspect-ratio: auto; height: auto; }
  #exp-canvas {
    width: 100%; height: 100%; display: block;
    background: #fff; border-radius: 4px;
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  .exp-right {
    flex: 1 1 260px; max-width: 420px; min-width: 240px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding-top: 8px;
  }
  .exp-eq {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; flex-wrap: wrap; font-size: clamp(1.4rem, 4vw, 1.9rem); font-weight: 800;
  }
  .exp-op { color: #95a5a6; font-size: 1.3em; padding: 0 2px; user-select: none; }
  .exp-chip {
    display: inline-flex; flex-direction: column; align-items: center;
    border: 2.5px solid transparent; border-radius: 12px;
    padding: 6px 10px; min-width: 56px; cursor: pointer;
    -webkit-user-select: none; user-select: none;
    transition: box-shadow 0.15s, border-color 0.15s, background 0.15s;
  }
  .exp-chip.blue { background: #eaf3fb; color: #2471a3; border-color: #a9cce3; }
  .exp-chip.red { background: #fdecea; color: #c0392b; border-color: #f5b7b1; }
  .exp-chip.purple { background: #f5eef8; color: #6c3483; border-color: #d2b4de; cursor: default; }
  .exp-chip.empty { background: #f7f9fc; color: #b0b8c4; border-color: #d5dde8; border-style: dashed; }
  .exp-chip.selected {
    border-style: dashed; border-width: 3px; border-color: #7f8c8d !important;
    box-shadow: 0 0 0 2px rgba(127, 140, 141, 0.18);
  }
  .exp-chip .exp-num, .exp-chip .exp-den {
    min-width: 1.4em; text-align: center; line-height: 1.15;
    padding: 2px 4px; border-radius: 6px;
    font-variant-numeric: tabular-nums;
  }
  .exp-chip .exp-num { border-bottom: 3px solid currentColor; margin-bottom: 3px; padding-bottom: 3px; }
  .exp-chip .digit-hit {
    display: inline-block; min-width: 1.6em; min-height: 1.6em;
    line-height: 1.6em; text-align: center; border-radius: 8px;
    padding: 4px 8px; cursor: pointer;
  }
  .exp-chip .digit-hit.expect {
    outline: 2px dashed currentColor; background: rgba(255,255,255,0.85);
  }
  .exp-chip .digit-hit:active { background: rgba(0,0,0,0.06); }
  .exp-chip.editing-digit .digit-hit.editing {
    outline: 2px dashed currentColor; background: rgba(255,255,255,0.7);
  }
  .exp-prompt {
    background: #eaf2fb; color: #2c5aa0; border-radius: 999px;
    padding: 10px 16px; font-weight: 700; font-size: 0.95rem;
    text-align: center; max-width: 100%; line-height: 1.45;
  }
  .exp-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; }
  .exp-actions .btn { min-width: 120px; }

  .exp-keypad-backdrop {
    display: none; position: fixed; inset: 0; z-index: 150;
    background: rgba(0,0,0,0.18); align-items: center; justify-content: center;
    padding: 16px;
  }
  .exp-keypad-backdrop.show { display: flex; }
  .exp-keypad {
    background: #fff; border-radius: 16px; padding: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.22);
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    width: min(280px, 90vw);
  }
  .exp-keypad button {
    border: 2px solid #e8eef5; background: #f7fafc; border-radius: 12px;
    font-size: 1.45rem; font-weight: 800; font-family: inherit;
    min-height: 56px; cursor: pointer; color: var(--text);
  }
  .exp-keypad button:active { background: #eaf4fb; transform: scale(0.96); }
  .exp-keypad button.zero { grid-column: 2; }
  .exp-keypad-hint {
    grid-column: 1 / -1; text-align: center; color: var(--muted);
    font-size: 0.85rem; font-weight: 600; padding: 4px 0 2px;
  }
  .toast {
    position: fixed; left: 50%; bottom: 24px;
    transform: translateX(-50%) translateY(calc(100% + 48px));
    background: #2c3e50; color: #fff; padding: 12px 18px; border-radius: 12px;
    font-weight: 600; z-index: 200; transition: transform 0.25s; max-width: 90vw;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.bad { background: var(--danger); }
  .toast.ok { background: var(--success); }
</style>
</head>
<body>
<main class="page">
  <header class="header">
    <h1>分數乘法二教學</h1>
    <div class="school">順德聯誼總會何日東小學</div>
  </header>

  <div id="explorer-shared" class="exp-card">
    <div class="exp-title"><span class="exp-ico" aria-hidden="true"></span>分數乘法探索器</div>
    <div class="exp-modes" role="group" aria-label="題型">
      <button type="button" class="exp-mode-btn active" id="exp-mode-proper" data-mode="proper" aria-pressed="true">真分數 × 真分數</button>
      <button type="button" class="exp-mode-btn" id="exp-mode-mixed" data-mode="mixed" aria-pressed="false">帶分數 × 真分數</button>
    </div>
    <div class="exp-body">
      <div class="exp-canvas-wrap">
        <canvas id="exp-canvas" width="560" height="560" aria-label="分數乘法面積模型"></canvas>
      </div>
      <div class="exp-right">
        <div class="exp-eq" id="exp-eq" aria-label="分數乘法算式">
          <div class="exp-chip blue empty" data-chip="blue" id="exp-chip-blue">
            <span class="exp-whole" id="exp-blue-whole" hidden><span class="digit-hit" data-field="bw">?</span></span>
            <span class="exp-num"><span class="digit-hit" data-field="bn">?</span></span>
            <span class="exp-den"><span class="digit-hit" data-field="bd">?</span></span>
          </div>
          <span class="exp-op">×</span>
          <div class="exp-chip red empty" data-chip="red" id="exp-chip-red">
            <span class="exp-num"><span class="digit-hit" data-field="rn">?</span></span>
            <span class="exp-den"><span class="digit-hit" data-field="rd">?</span></span>
          </div>
          <span class="exp-op">=</span>
          <div class="exp-chip purple empty" data-chip="purple" id="exp-chip-purple">
            <span class="exp-whole" id="exp-purple-whole" hidden><span class="digit-hit" data-field="pw">?</span></span>
            <span class="exp-num"><span class="digit-hit" data-field="pn">?</span></span>
            <span class="exp-den"><span class="digit-hit" data-field="pd">?</span></span>
          </div>
        </div>
        <div class="exp-prompt" id="exp-prompt">第一步：先填寫左側藍色的分母</div>
        <div class="exp-actions">
          <button type="button" class="btn btn-ghost" id="exp-btn-reset">重新開始</button>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="exp-keypad-backdrop" id="exp-keypad-backdrop" aria-hidden="true">
  <div class="exp-keypad" id="exp-keypad" role="dialog" aria-label="數字鍵盤">
    <div class="exp-keypad-hint" id="exp-keypad-hint">請選擇數字</div>
    <button type="button" data-dig="1">1</button>
    <button type="button" data-dig="2">2</button>
    <button type="button" data-dig="3">3</button>
    <button type="button" data-dig="4">4</button>
    <button type="button" data-dig="5">5</button>
    <button type="button" data-dig="6">6</button>
    <button type="button" data-dig="7">7</button>
    <button type="button" data-dig="8">8</button>
    <button type="button" data-dig="9">9</button>
    <button type="button" class="zero" data-dig="0">0</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* 分數乘法二教學（獨立頁）
   從課堂頁的面積模型抽出，可離線開啟或整份嵌入。
   沒有 PubNub、課堂編號、老師監察、學生提交，也沒有其他分頁。
   預設是真分數 × 真分數：先點分母出分割線，再點分子出斜線。
   可切換帶分數 × 真分數。句序跟課本：全部共有幾個單位分數、分成等份、取幾份、得到。
   圖仍用真分數那套斜線：單向斜線是單位分數，交叉斜線是取走的積。
   積小於 1 留在直條圖裡。積大於或等於 1 時，交叉斜線收成完整的 1 各佔一格，餘數只佔下一格的若干份。
   數字填完不會立刻顯示答案。再點已填的數字會重播該步。
   斜線旁的三句說明已刪，不要加回。
   乘積按分子相乘、分母相乘直接顯示，本教學頁不另約成最簡。
   帶分數的積若大於或等於 1，改寫成帶分數（餘數不約簡）；剛好是整數就只顯示整數。
   順德聯誼總會何日東小學
*/
function toast(msg, kind) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { el.classList.remove('show', 'ok', 'bad'); }, 2400);
}

(function () {
  var state = {
    mode: (location.hash === '#mixed') ? 'mixed' : 'proper',
    bw: null, bn: null, bd: null, rn: null, rd: null,
    highlight: null,
    editing: null,
    fillStep: 1,     // proper: 1 bd, 2 bn, 3 rd, 4 rn, 5 done
    lastTap: { field: null, t: 0 },
    /* Canvas stays blank until that part of the fraction is tapped. */
    revealed: { bw: false, bd: false, bn: false, rd: false, rn: false },
    anim: null
  };

  var PROMPTS = {
    1: '第一步：先填寫左側藍色的分母',
    2: '第二步：再填寫左側藍色的分子',
    3: '第三步：再填寫右側紅色的分母',
    4: '第四步：再填寫右側紅色的分子'
  };
  var PROMPTS_MIXED = {
    1: '第一步：先填寫左側藍色的整數',
    2: '第二步：再填寫左側藍色的分母',
    3: '第三步：再填寫左側藍色的分子',
    4: '第四步：再填寫右側紅色的分母',
    5: '第五步：再填寫右側紅色的分子'
  };
  var FIELD_HINT = {
    bd: '填寫左側藍色的分母',
    bn: '填寫左側藍色的分子',
    rd: '填寫右側紅色的分母',
    rn: '填寫右側紅色的分子'
  };
  var FIELD_HINT_MIXED = {
    bw: '填寫左側藍色的整數',
    bd: '填寫左側藍色的分母',
    bn: '填寫左側藍色的分子',
    rd: '填寫右側紅色的分母',
    rn: '填寫右側紅色的分子'
  };
  var EXPLAIN_PROMPT = '點分母看分割，點分子看斜線。再點可重播。';

  function isMixed() { return state.mode === 'mixed'; }

  function promptsForMode() { return isMixed() ? PROMPTS_MIXED : PROMPTS; }

  function doneStep() { return isMixed() ? 6 : 5; }

  var canvas, ctx;
  var animRaf = 0;

  function $(id) { return document.getElementById(id); }

  function product() {
    if (isMixed()) {
      if (state.bw == null || state.bn == null || state.bd == null || state.rn == null || state.rd == null) return null;
      /* 帶分數先化假分數：(整數×分母+分子)/分母，再與真分數分子乘分子、分母乘分母。不約簡。 */
      return { n: (state.bw * state.bd + state.bn) * state.rn, d: state.bd * state.rd };
    }
    if (state.bn == null || state.bd == null || state.rn == null || state.rd == null) return null;
    return { n: state.bn * state.rn, d: state.bd * state.rd };
  }

  /* kind: frac | mixed | int. Proper mode always stays a single fraction, even if improper. */
  function formatProduct(p) {
    if (!p) return null;
    if (!isMixed()) return { kind: 'frac', n: p.n, d: p.d };
    if (p.d > 0 && p.n >= p.d) {
      var w = Math.floor(p.n / p.d);
      var rem = p.n % p.d;
      if (rem === 0) return { kind: 'int', w: w };
      return { kind: 'mixed', w: w, n: rem, d: p.d };
    }
    return { kind: 'frac', n: p.n, d: p.d };
  }

  function isComplete() {
    if (isMixed() && state.bw == null) return false;
    return state.bn != null && state.bd != null && state.rn != null && state.rd != null;
  }

  function recomputeStep() {
    if (isMixed()) {
      if (state.bw == null) state.fillStep = 1;
      else if (state.bd == null) state.fillStep = 2;
      else if (state.bn == null) state.fillStep = 3;
      else if (state.rd == null) state.fillStep = 4;
      else if (state.rn == null) state.fillStep = 5;
      else state.fillStep = 6;
      return;
    }
    if (state.bd == null) state.fillStep = 1;
    else if (state.bn == null) state.fillStep = 2;
    else if (state.rd == null) state.fillStep = 3;
    else if (state.rn == null) state.fillStep = 4;
    else state.fillStep = 5;
  }

  function answerRevealed() {
    if (isMixed()) {
      /* 課本最後一步是「取其中的幾份」之後得到積，對應點開右側分子。 */
      return !!(state.revealed.rn && state.bw && state.bn != null &&
        state.rn != null && state.bd && state.rd);
    }
    return !!(state.revealed.bn && state.revealed.rn &&
      state.bn != null && state.rn != null && state.bd && state.rd);
  }

  function easeOut(t) {
    t = Math.max(0, Math.min(1, t));
    return 1 - Math.pow(1 - t, 3);
  }

  function fieldProgress(field) {
    if (state.anim && state.anim.field === field) {
      var t = (performance.now() - state.anim.t0) / state.anim.dur;
      if (t >= 1) return 1;
      return easeOut(t);
    }
    return state.revealed[field] ? 1 : 0;
  }

  function stopAnim() {
    if (animRaf) cancelAnimationFrame(animRaf);
    animRaf = 0;
    state.anim = null;
  }

  function playExplain(field) {
    if (field !== 'bw' && field !== 'bd' && field !== 'bn' && field !== 'rd' && field !== 'rn') return;
    if (state[field] == null) return;
    state.revealed[field] = true;
    state.highlight = field;
    state.anim = { field: field, t0: performance.now(), dur: 720 };
    updateChipsUI();
    if (animRaf) cancelAnimationFrame(animRaf);
    /* 帶分數的格數變了，畫布改成橫向一列，不要再留著正方形空白。 */
    if (isMixed()) resizeCanvas();
    function frame() {
      if (!canvas || !state.anim || state.anim.field !== field) return;
      var t = (performance.now() - state.anim.t0) / state.anim.dur;
      drawModel(canvas.clientWidth || 400);
      if (t < 1 && state.anim && state.anim.field === field) animRaf = requestAnimationFrame(frame);
      else if (state.anim && state.anim.field === field) {
        state.anim = null;
        if (isMixed()) resizeCanvas();
      }
    }
    frame();
  }

  function clearReveal(field) {
    state.revealed[field] = false;
    if (field === 'bd') state.revealed.bn = false;
    if (field === 'rd') state.revealed.rn = false;
  }

  function resizeCanvas() {
    if (!canvas) return;
    var wrap = canvas.parentElement;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var slots = (isMixed() && state.bw != null) ? mixedLayoutSlots() : 1;
    if (isMixed() && slots > 1) {
      wrap.classList.add('compact');
      var cssW = Math.floor(wrap.clientWidth || 480);
      if (cssW > 560) cssW = 560;
      if (cssW < 200) cssW = 280;
      var pad = 14;
      var gap = slots > 1 ? 12 : 0;
      var unit = (cssW - pad * 2 - gap * (slots - 1)) / slots;
      var cssH = Math.ceil(unit + pad * 2);
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);
      canvas.style.width = cssW + 'px';
      canvas.style.height = cssH + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawModel(cssW, cssH);
      return;
    }
    wrap.classList.remove('compact');
    var size = Math.floor(Math.min(wrap.clientWidth || 480, wrap.clientHeight || 480, 560));
    if (size < 200) size = 280;
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawModel(size);
  }

  var HATCH_NEUTRAL = '#2c3e50';

  function hatch(x, y, w, h, color, dir, gap, lineWidth) {
    gap = gap || 8;
    if (!(w > 0) || !(h > 0) || !(gap > 0)) return;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth || 1.6;
    ctx.beginPath();
    var span = w + h;
    var rem = span % gap;
    if (rem < 0) rem += gap;
    if (gap - rem < 0.05) rem = 0;
    var margin = rem / 2;
    var i;
    var start = -h + margin;
    var end = w - margin;
    if (dir < 0) {
      for (i = start; i <= end + 0.01; i += gap) {
        ctx.moveTo(x + i, y);
        ctx.lineTo(x + i + h, y + h);
      }
    } else {
      for (i = start; i <= end + 0.01; i += gap) {
        ctx.moveTo(x + i, y + h);
        ctx.lineTo(x + i + h, y);
      }
    }
    ctx.stroke();
    ctx.restore();
  }

  function strokeGrowingLines(x0, y0, W, H, count, vertical, color, progress) {
    if (!(count > 1) || !(progress > 0)) return;
    var lines = count - 1;
    var slot = 0.62;
    var gap = lines > 1 ? (1 - slot) / (lines - 1) : 0;
    ctx.save();
    ctx.setLineDash([6, 5]);
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = color;
    ctx.beginPath();
    var i, lp, pos;
    for (i = 1; i <= lines; i++) {
      lp = (progress - (i - 1) * gap) / slot;
      if (lp <= 0) continue;
      if (lp > 1) lp = 1;
      if (vertical) {
        pos = x0 + (W / count) * i;
        ctx.moveTo(pos, y0);
        ctx.lineTo(pos, y0 + H * lp);
      } else {
        pos = y0 + (H / count) * i;
        ctx.moveTo(x0, pos);
        ctx.lineTo(x0 + W * lp, pos);
      }
    }
    ctx.stroke();
    ctx.restore();
  }

  function strokePartitionLines(x0, y0, W, H) {
    if (state.revealed.bd) strokeGrowingLines(x0, y0, W, H, state.bd, true, '#5dade2', fieldProgress('bd'));
    if (state.revealed.rd) strokeGrowingLines(x0, y0, W, H, state.rd, false, '#e74c3c', fieldProgress('rd'));
  }

  function withRevealClip(field, x, y, w, h, axis, draw) {
    ctx.save();
    if (field && state.anim && state.anim.field === field) {
      var p = fieldProgress(field);
      ctx.beginPath();
      if (axis === 'y') ctx.rect(x, y, w, Math.max(0.01, h * p));
      else ctx.rect(x, y, Math.max(0.01, w * p), h);
      ctx.clip();
    }
    draw();
    ctx.restore();
  }

  function drawModel(cssSize, cssHeight) {
    if (isMixed()) drawMixedModel(cssSize, cssHeight);
    else drawProperModel(cssSize);
  }

  function drawProperModel(cssSize) {
    if (!ctx) return;
    var S = cssSize || (canvas.clientWidth || 400);
    var pad = 10;
    var x0 = pad, y0 = pad, W = S - pad * 2, H = S - pad * 2;

    ctx.clearRect(0, 0, S, S);
    ctx.setLineDash([]);

    ctx.lineWidth = 4;
    ctx.strokeStyle = '#2c3e50';
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x0, y0, W, H);
    ctx.strokeRect(x0 + 1, y0 + 1, W - 2, H - 2);

    var bd = state.bd, bn = state.bn, rd = state.rd, rn = state.rn;
    var showBn = state.revealed.bn && bd && bn != null && bn > 0;
    var showRn = state.revealed.rn && rd && rn != null && rn > 0;
    var bw = showBn ? (W / bd) * Math.min(bn, bd) : 0;
    var rh2 = showRn ? (H / rd) * Math.min(rn, rd) : 0;
    var hasOverlap = bw > 0 && rh2 > 0;

    if (bw > 0) {
      withRevealClip('bn', x0, y0, bw, H, 'x', function () {
        var by = y0 + (hasOverlap ? rh2 : 0);
        var bh = H - (hasOverlap ? rh2 : 0);
        hatch(x0, by, bw, bh, HATCH_NEUTRAL, -1, 36);
      });
    }
    if (rh2 > 0) {
      withRevealClip('rn', x0, y0, W, rh2, 'y', function () {
        var rx = x0 + (hasOverlap ? bw : 0);
        var rw = W - (hasOverlap ? bw : 0);
        hatch(rx, y0, rw, rh2, HATCH_NEUTRAL, 1, 36);
      });
    }
    if (hasOverlap) {
      var overlapField = (state.anim && (state.anim.field === 'bn' || state.anim.field === 'rn')) ? state.anim.field : null;
      withRevealClip(overlapField, x0, y0, bw, rh2, overlapField === 'rn' ? 'y' : 'x', function () {
        hatch(x0, y0, bw, rh2, HATCH_NEUTRAL, -1, 28);
        hatch(x0, y0, bw, rh2, HATCH_NEUTRAL, 1, 28);
      });
    }

    strokePartitionLines(x0, y0, W, H);

    ctx.lineWidth = 4;
    ctx.strokeStyle = '#2c3e50';
    ctx.setLineDash([]);
    ctx.strokeRect(x0 + 1, y0 + 1, W - 2, H - 2);
  }

  /* 帶分數用和真分數相同的斜線。單向是單位分數，交叉是取走後的積。
     積大於或等於 1 時，交叉斜線收成完整的 1 和餘下的一格。 */
  function mixedStructure() {
    if (state.bw == null) return null;
    var any = state.revealed.bw || state.revealed.bd || state.revealed.bn || state.revealed.rd || state.revealed.rn;
    if (!any) return null;
    var frac = state.bd != null && (state.revealed.bd || state.revealed.bn || state.revealed.rd || state.revealed.rn);
    return { wholes: state.bw, frac: !!frac };
  }

  function showingProduct() {
    if (!isMixed() || !answerRevealed()) return false;
    var fmt = formatProduct(product());
    if (!fmt || fmt.kind === 'frac') return false;
    if (state.anim && state.anim.field !== 'rn') return false;
    return true;
  }

  function productView() {
    var p = product();
    var fmt = formatProduct(p);
    if (!p || !fmt || !state.bd || !state.rd) return null;
    var cols = state.bd;
    var rows = state.rd;
    var wholes = 0;
    var rem = 0;
    if (fmt.kind === 'int') wholes = fmt.w;
    else if (fmt.kind === 'mixed') { wholes = fmt.w; rem = fmt.n; }
    else rem = fmt.n;
    var slots = wholes + (rem > 0 ? 1 : 0);
    if (slots < 1) slots = 1;
    return { wholes: wholes, rem: rem, cols: cols, rows: rows, per: cols * rows, slots: slots };
  }

  /* 點整數：只畫那麼多格完整的 1。點到分數部分才多開一格，並切成單位分數。 */
  function unitFractionView() {
    return !!(state.revealed.bd || state.revealed.bn || state.revealed.rd || state.revealed.rn);
  }

  function wholeOnlyView() {
    if (state.anim && state.anim.field === 'bw') return true;
    return !unitFractionView();
  }

  function mixedLayoutSlots() {
    if (state.bw && wholeOnlyView()) return state.bw;
    if (showingProduct()) {
      var prod = productView();
      if (prod) return prod.slots;
    }
    if (!state.bd) return state.bw || 1;
    return (state.bw || 0) + 1;
  }

  function mixedRowGeom(SW, SH, slots) {
    var pad = 14;
    var gap = slots > 1 ? 12 : 0;
    var availW = SW - pad * 2 - gap * (slots - 1);
    var availH = SH - pad * 2;
    var unit = Math.min(availW / slots, availH);
    var totalW = unit * slots + gap * (slots - 1);
    var x0 = pad + Math.max(0, (SW - pad * 2 - totalW) / 2);
    return { unit: unit, gap: gap, x0: x0, y0: pad, slots: slots };
  }

  function slash(x, y, w, h, unit, both) {
    if (!(w > 0.5) || !(h > 0.5)) return;
    var gap = Math.max(7, Math.min(both ? 16 : 22, unit / 7));
    hatch(x, y, w, h, HATCH_NEUTRAL, -1, gap);
    if (both) hatch(x, y, w, h, HATCH_NEUTRAL, 1, Math.max(6, gap * 0.85));
  }

  function hatchCellCount(sx, y0, unit, cols, rows, count) {
    if (count <= 0) return;
    var cw = unit / cols;
    var rh = unit / rows;
    var fullRows = Math.floor(count / cols);
    var extra = count % cols;
    if (fullRows > 0) slash(sx, y0, unit, Math.min(unit, fullRows * rh), unit, true);
    if (extra > 0 && fullRows < rows) slash(sx, y0 + fullRows * rh, extra * cw, rh, unit, true);
  }

  /* 交叉斜線收成：每一個 1 佔滿一格，餘數只畫下一格的若干小格。 */
  function drawProductSquares(SW, SH) {
    var prod = productView();
    if (!prod) return;
    var g = mixedRowGeom(SW, SH, prod.slots);
    var unit = g.unit;
    var y0 = g.y0;
    var cols = prod.cols;
    var rows = prod.rows;
    var total = prod.wholes * prod.per + prod.rem;
    var progress = 1;
    if (state.anim && state.anim.field === 'rn') progress = fieldProgress('rn');
    var visible = (progress >= 1) ? total : Math.floor(total * progress + 1e-6);
    var used = 0;
    var i;
    for (i = 0; i < prod.slots; i++) {
      var sx = g.x0 + i * (unit + g.gap);
      var cap = (i < prod.wholes) ? prod.per : prod.rem;
      var show = Math.max(0, Math.min(cap, visible - used));
      used += cap;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(sx, y0, unit, unit);
      if (show >= cols * rows) slash(sx, y0, unit, unit, unit, true);
      else hatchCellCount(sx, y0, unit, cols, rows, show);
      if (cols > 1) strokeGrowingLines(sx, y0, unit, unit, cols, true, '#5dade2', 1);
      if (rows > 1) strokeGrowingLines(sx, y0, unit, unit, rows, false, '#e74c3c', 1);
      ctx.setLineDash([]);
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#2c3e50';
      ctx.strokeRect(sx + 1, y0 + 1, unit - 2, unit - 2);
    }
  }

  /* 單向斜線是單位分數直條，交叉斜線是取走的份。分割線仍是藍直、紅橫。 */
  function paintTaken(x, y, w, h, unit, takeP) {
    var gh = h * takeP;
    if (takeP < 1) slash(x, y + gh, w, h - gh, unit, false);
    if (gh > 0.5) slash(x, y, w, gh, unit, true);
  }

  function drawTextbook(SW, SH) {
    var bw = state.bw;
    var bd = state.bd;
    var bn = state.bn;
    var rd = state.rd;
    var rn = state.rn;
    /* 點整數只出完整的 1。處理分數部分時，整數格和旁邊那一格都切開，斜線佔 bw×分母+分子 份。 */
    var wholeOnly = wholeOnlyView();
    var split = !wholeOnly && bd > 1;
    var showBn = !wholeOnly && bd && bn != null && bn > 0;
    var showRows = !wholeOnly && !!(state.revealed.rd && rd > 1);
    var showTake = !wholeOnly && !!(state.revealed.rn && rd && rn != null && rn > 0);
    var slots = (wholeOnly || !bd) ? bw : bw + 1;
    var g = mixedRowGeom(SW, SH, slots);
    var unit = g.unit;
    var y0 = g.y0;
    var takeP = 0;
    if (showTake) {
      takeP = Math.min(rn, rd) / rd;
      if (state.anim && state.anim.field === 'rn') takeP *= fieldProgress('rn');
    }
    var vProg = (state.anim && state.anim.field === 'bd') ? fieldProgress('bd') : 1;
    var hProg = (state.anim && state.anim.field === 'rd') ? fieldProgress('rd') : 1;
    var bnProg = (state.anim && state.anim.field === 'bn') ? fieldProgress('bn') : 1;
    var clipBw = state.anim && state.anim.field === 'bw';
    if (clipBw) {
      ctx.save();
      var span = slots * unit + Math.max(0, slots - 1) * g.gap;
      ctx.beginPath();
      ctx.rect(g.x0, y0, Math.max(0.01, span * fieldProgress('bw')), unit);
      ctx.clip();
    }
    var i;
    for (i = 0; i < slots; i++) {
      var sx = g.x0 + i * (unit + g.gap);
      var isWhole = i < bw;
      var cols = (isWhole && !split) ? 1 : (bd > 1 ? bd : 1);
      var yellow = cols;
      if (!isWhole) yellow = showBn ? Math.min(bn, bd) : 0;
      if (!isWhole && state.anim && state.anim.field === 'bn') yellow *= bnProg;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(sx, y0, unit, unit);
      if (isWhole && !split) {
        paintTaken(sx, y0, unit, unit, unit, takeP);
      } else if (cols > 1 || yellow > 0) {
        var cw = unit / cols;
        var k, x;
        var yLim = Math.ceil(yellow - 1e-6);
        for (k = 0; k < cols; k++) {
          if (k >= yLim) continue;
          x = sx + k * cw;
          var w = cw;
          if (k === yLim - 1 && yellow < yLim) w = cw * (yellow - (yLim - 1));
          paintTaken(x, y0, w, unit, unit, takeP);
        }
        if ((split || !isWhole) && cols > 1) {
          strokeGrowingLines(sx, y0, unit, unit, cols, true, '#5dade2', vProg);
        }
      }
      if (showRows) strokeGrowingLines(sx, y0, unit, unit, rd, false, '#e74c3c', hProg);
      ctx.setLineDash([]);
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#2c3e50';
      ctx.strokeRect(sx + 1, y0 + 1, unit - 2, unit - 2);
    }
    if (clipBw) ctx.restore();
  }

  function drawMixedModel(cssSize, cssHeight) {
    if (!ctx) return;
    var SW = cssSize || canvas.clientWidth || 400;
    var SH = cssHeight || canvas.clientHeight || SW;
    ctx.clearRect(0, 0, SW, SH);
    ctx.setLineDash([]);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, SW, SH);

    if (showingProduct()) {
      drawProductSquares(SW, SH);
      return;
    }

    if (!mixedStructure()) {
      var pad0 = 10;
      var side = Math.min(SW, SH) - pad0 * 2;
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#2c3e50';
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(pad0, pad0, side, side);
      ctx.strokeRect(pad0 + 1, pad0 + 1, side - 2, side - 2);
      return;
    }

    drawTextbook(SW, SH);
  }

  function setDigitText(field, val) {
    var el = document.querySelector('#exp-eq .digit-hit[data-field="' + field + '"]');
    if (!el) return;
    el.textContent = (val == null) ? '?' : String(val);
  }

  function updateChipsUI() {
    setDigitText('bw', state.bw);
    setDigitText('bn', state.bn);
    setDigitText('bd', state.bd);
    setDigitText('rn', state.rn);
    setDigitText('rd', state.rd);
    var p = product();
    var showAnswer = answerRevealed();
    var fmt = showAnswer ? formatProduct(p) : null;

    var blue = $('exp-chip-blue');
    var red = $('exp-chip-red');
    var purple = $('exp-chip-purple');
    var blueWhole = $('exp-blue-whole');
    var purpleWhole = $('exp-purple-whole');
    function syncChip(el, hasAny, colorClass) {
      el.classList.remove('empty', 'selected', 'blue', 'red', 'purple');
      el.classList.add(colorClass);
      if (!hasAny) el.classList.add('empty');
    }
    syncChip(blue, state.bn != null || state.bd != null || (isMixed() && state.bw != null), 'blue');
    syncChip(red, state.rn != null || state.rd != null, 'red');
    syncChip(purple, showAnswer && !!p, 'purple');

    blue.classList.toggle('as-mixed', isMixed());
    blueWhole.hidden = !isMixed();
    purple.classList.remove('as-mixed', 'as-int');
    if (!fmt || fmt.kind === 'frac') {
      purpleWhole.hidden = true;
      setDigitText('pw', null);
      setDigitText('pn', fmt ? fmt.n : null);
      setDigitText('pd', fmt ? fmt.d : null);
    } else if (fmt.kind === 'int') {
      purple.classList.add('as-int');
      purpleWhole.hidden = false;
      setDigitText('pw', fmt.w);
      setDigitText('pn', null);
      setDigitText('pd', null);
    } else {
      purple.classList.add('as-mixed');
      purpleWhole.hidden = false;
      setDigitText('pw', fmt.w);
      setDigitText('pn', fmt.n);
      setDigitText('pd', fmt.d);
    }

    var map = { bw: blue, bn: blue, bd: blue, rn: red, rd: red, pw: purple, pn: purple, pd: purple };
    if (state.highlight && map[state.highlight]) {
      map[state.highlight].classList.add('selected');
    }

    recomputeStep();
    var expectField = null;
    if (state.fillStep >= 1 && state.fillStep < doneStep()) {
      expectField = fieldForStep(state.fillStep);
    }
    document.querySelectorAll('#exp-eq .digit-hit').forEach(function (d) {
      var f = d.getAttribute('data-field');
      d.classList.toggle('editing', state.editing === f);
      d.classList.toggle('expect', expectField === f && state.editing == null);
    });
    blue.classList.toggle('editing-digit', state.editing === 'bn' || state.editing === 'bd' || state.editing === 'bw');
    red.classList.toggle('editing-digit', state.editing === 'rn' || state.editing === 'rd');
    if (expectField && !state.highlight) {
      if (expectField === 'bw' || expectField === 'bn' || expectField === 'bd') blue.classList.add('selected');
      if (expectField === 'rn' || expectField === 'rd') red.classList.add('selected');
    }

    var properBtn = $('exp-mode-proper');
    var mixedBtn = $('exp-mode-mixed');
    if (properBtn && mixedBtn) {
      properBtn.classList.toggle('active', !isMixed());
      mixedBtn.classList.toggle('active', isMixed());
      properBtn.setAttribute('aria-pressed', isMixed() ? 'false' : 'true');
      mixedBtn.setAttribute('aria-pressed', isMixed() ? 'true' : 'false');
    }
    var eq = $('exp-eq');
    eq.classList.toggle('mixed', isMixed());
    eq.setAttribute('aria-label', isMixed() ? '帶分數乘真分數算式' : '分數乘法算式');

    var prompt = $('exp-prompt');
    var filled = state.fillStep === doneStep();
    prompt.hidden = false;
    prompt.setAttribute('aria-hidden', 'false');
    prompt.textContent = isMixed()
      ? mixedTeachPrompt()
      : (filled ? EXPLAIN_PROMPT : (PROMPTS[state.fillStep] || ''));
  }

  function unitPiecePhrase() {
    return state.bd ? (state.bd + '分之1') : '';
  }

  function answerPhrase(fmt) {
    if (!fmt) return '';
    if (fmt.kind === 'int') return String(fmt.w);
    if (fmt.kind === 'mixed') return fmt.w + '又' + fmt.d + '分之' + fmt.n;
    return fmt.d + '分之' + fmt.n;
  }

  /* 課本句序：全部共有幾個單位分數 → 每個分成幾等份 → 取其中幾份 → 得到。 */
  function mixedTeachPrompt() {
    if (state.bw == null) return PROMPTS_MIXED[1];
    if (state.bd == null) return PROMPTS_MIXED[2];
    if (state.bn == null) return PROMPTS_MIXED[3];
    var piece = unitPiecePhrase();
    var count = state.bw * state.bd + state.bn;
    if (state.rd == null) {
      return '1. 全部共有 ' + count + ' 個' + piece + '。2. 把每個' + piece + '都分成？等份';
    }
    if (state.rn == null) {
      return '2. 把每個' + piece + '都分成 ' + state.rd + ' 等份。3. 取其中的？份';
    }
    if (!answerRevealed()) {
      return '3. 取其中的 ' + state.rn + ' 份。再點紅色分子，看得到多少';
    }
    return '4. 得到 ' + answerPhrase(formatProduct(product())) + '。再點可重播。';
  }

  function mixedFieldHint(field) {
    var piece = unitPiecePhrase();
    if (field === 'rd' && piece) return '把每個' + piece + '都分成幾等份？';
    if (field === 'rn') return '取其中的幾份？';
    return FIELD_HINT_MIXED[field] || '請選擇數字';
  }

  function renderAll() {
    updateChipsUI();
    resizeCanvas();
  }

  function openKeypad(field) {
    if (field === 'pn' || field === 'pd' || field === 'pw') return;
    stopAnim();
    state.highlight = null;
    state.editing = field;
    var bd = $('exp-keypad-backdrop');
    var hint = $('exp-keypad-hint');
    hint.textContent = (isMixed() ? mixedFieldHint(field) : FIELD_HINT[field]) || '請選擇數字';
    bd.classList.add('show');
    bd.setAttribute('aria-hidden', 'false');
    updateChipsUI();
    if (canvas) drawModel(canvas.clientWidth || 400);
  }

  function closeKeypad() {
    state.editing = null;
    var bd = $('exp-keypad-backdrop');
    bd.classList.remove('show');
    bd.setAttribute('aria-hidden', 'true');
    updateChipsUI();
  }

  function digitError(field, n) {
    if ((field === 'bd' || field === 'rd') && n === 0) return '分母不能為 0';
    if (!isMixed()) return '';
    if (field === 'bw' && n === 0) return '整數部分不能為 0';
    if ((field === 'bd' || field === 'rd') && n < 2) return '分母至少是 2';
    if (field === 'bn' || field === 'rn') {
      if (n === 0) return '分子不能為 0';
      var den = field === 'bn' ? state.bd : state.rd;
      if (den != null && n >= den) return '分子要小於分母';
    }
    if (field === 'bd' && state.bn != null && state.bn >= n) return '分母要大於分子';
    if (field === 'rd' && state.rn != null && state.rn >= n) return '分母要大於分子';
    return '';
  }

  function applyDigit(n) {
    var f = state.editing;
    if (!f) return;
    var err = digitError(f, n);
    if (err) {
      if (typeof toast === 'function') toast(err, 'bad');
      return;
    }
    state[f] = n;
    clearReveal(f);
    stopAnim();
    recomputeStep();
    closeKeypad();
    renderAll();
  }

  function resetExplorer() {
    state.bw = state.bn = state.bd = state.rn = state.rd = null;
    state.highlight = null;
    state.editing = null;
    state.fillStep = 1;
    state.revealed = { bw: false, bd: false, bn: false, rd: false, rn: false };
    stopAnim();
    closeKeypad();
    renderAll();
  }

  function setMode(mode) {
    if (mode !== 'proper' && mode !== 'mixed') return;
    if (state.mode === mode) return;
    state.mode = mode;
    try {
      if (mode === 'mixed') history.replaceState(null, '', '#mixed');
      else history.replaceState(null, '', location.pathname + location.search);
    } catch (e) {}
    resetExplorer();
  }

  function fieldForStep(step) {
    if (isMixed()) return { 1: 'bw', 2: 'bd', 3: 'bn', 4: 'rd', 5: 'rn' }[step];
    return { 1: 'bd', 2: 'bn', 3: 'rd', 4: 'rn' }[step];
  }

  function onDigitPointer(field, isDouble) {
    if (field === 'pn' || field === 'pd' || field === 'pw') {
      if (answerRevealed()) {
        state.highlight = (state.highlight === field) ? null : field;
        renderAll();
      }
      return;
    }

    if (state[field] == null) {
      if (!isComplete()) {
        var expected = fieldForStep(state.fillStep);
        openKeypad(field === expected ? field : (expected || field));
      }
      return;
    }

    /* A filled number replays its picture. A quick second tap still opens
       the keypad so a wrong digit can be corrected without 重新開始. */
    if (isDouble) {
      openKeypad(field);
      return;
    }
    playExplain(field);
  }

  function handleDigitEvent(field) {
    var now = Date.now();
    var isDouble = (state.lastTap.field === field && (now - state.lastTap.t) < 350);
    state.lastTap = { field: field, t: now };
    onDigitPointer(field, isDouble);
  }

  function wireExplorer() {
    document.querySelectorAll('#exp-eq .digit-hit').forEach(function (el) {
      var holdTimer = 0;
      var holdOpened = false;
      function cancelHold() {
        if (holdTimer) clearTimeout(holdTimer);
        holdTimer = 0;
      }
      el.addEventListener('pointerdown', function () {
        cancelHold();
        holdOpened = false;
        var field = el.getAttribute('data-field');
        if (field === 'pn' || field === 'pd' || field === 'pw') return;
        holdTimer = setTimeout(function () {
          holdTimer = 0;
          if (state[field] == null) return;
          holdOpened = true;
          openKeypad(field);
        }, 550);
      });
      el.addEventListener('pointerup', cancelHold);
      el.addEventListener('pointerleave', cancelHold);
      el.addEventListener('pointercancel', cancelHold);
      el.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (holdOpened) { holdOpened = false; return; }
        handleDigitEvent(el.getAttribute('data-field'));
      });
    });
    ['exp-chip-blue', 'exp-chip-red', 'exp-chip-purple'].forEach(function (id) {
      var chip = $(id);
      if (!chip) return;
      chip.addEventListener('click', function (e) {
        if (e.target.classList.contains('digit-hit')) return;
        var color = chip.getAttribute('data-chip');
        if (color === 'purple') {
          if (answerRevealed()) {
            state.highlight = state.highlight === 'pn' ? null : 'pn';
            renderAll();
          }
          return;
        }
        if (color === 'blue' && isMixed()) {
          if (state.bw == null && state.bd == null && state.bn == null) {
            if (!isComplete()) {
              var expectMixed = fieldForStep(state.fillStep);
              if (expectMixed) openKeypad(expectMixed);
            }
            return;
          }
          if (state.bw != null && !state.revealed.bw) playExplain('bw');
          else if (state.bd != null && !state.revealed.bd) playExplain('bd');
          else if (state.bn != null) playExplain('bn');
          else if (state.bd != null) playExplain('bd');
          else playExplain('bw');
          return;
        }
        var numF = color === 'blue' ? 'bn' : 'rn';
        var denF = color === 'blue' ? 'bd' : 'rd';
        if (state[denF] == null && state[numF] == null) {
          if (!isComplete()) {
            var expected = fieldForStep(state.fillStep);
            if (expected) openKeypad(expected);
          }
          return;
        }
        if (state[denF] != null && !state.revealed[denF]) playExplain(denF);
        else if (state[numF] != null) playExplain(numF);
        else playExplain(denF);
      });
    });

    $('exp-btn-reset').onclick = resetExplorer;

    document.querySelectorAll('.exp-mode-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        setMode(btn.getAttribute('data-mode'));
      });
    });

    $('exp-keypad').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-dig]');
      if (!btn) return;
      applyDigit(parseInt(btn.getAttribute('data-dig'), 10));
    });
    $('exp-keypad-backdrop').addEventListener('click', function (e) {
      if (e.target === $('exp-keypad-backdrop')) closeKeypad();
    });

    window.addEventListener('resize', function () {
      if ($('explorer-shared') && !$('explorer-shared').hidden) resizeCanvas();
    });
  }

  canvas = $('exp-canvas');
  ctx = canvas.getContext('2d');
  wireExplorer();
  renderAll();
})();
</script>
</body>
</html>
